<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>WebTracker Pro v3</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; margin: 0; padding: 20px; overflow: hidden; user-select: none; }
        h1 { margin-top: 0; font-size: 1.2rem; color: #fff; }
        
        .container { display: flex; gap: 20px; }
        .column { flex: 1; }
        
        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #0f0; margin-bottom: 15px; }
        .tab { padding: 8px 15px; cursor: pointer; border: 1px solid #0f0; border-bottom: none; margin-right: 5px; background: #222; }
        .tab.active { background: #0f0; color: #000; font-weight: bold; }
        .panel { display: none; background: #1a1a1a; padding: 15px; border: 1px solid #333; height: 350px; overflow-y: auto; }
        .panel.active { display: block; }
        
        /* Controls */
        button { background: #0f0; color: #000; border: none; padding: 8px 15px; cursor: pointer; font-family: inherit; font-weight: bold; margin-bottom: 10px;}
        button:hover { background: #fff; }
        button.red { background: #f00; color: #fff; }
        label { display: block; margin-bottom: 10px; font-size: 0.9rem; }
        input[type=range] { width: 100%; margin-top: 5px; cursor: pointer; }
        input[type=number], select { background: #000; color: #0f0; border: 1px solid #0f0; font-family: monospace; padding: 3px; }
        
        /* Tracker Editor */
        #pattern-editor { font-family: monospace; background: #000; padding: 10px; border: 1px solid #333; width: fit-content; height: 320px; overflow-y: auto;}
        .row { display: flex; padding: 2px 0; border-bottom: 1px solid #111;}
        .row:nth-child(4n+1) { background: #1a1a1a; } /* Beat korostus */
        .row-number { width: 30px; color: #777; }
        .cell { width: 60px; text-align: center; border: 1px solid transparent; cursor: pointer; color: #aaa; }
        .cell.active { background: #0f0; color: #000; font-weight: bold; }
        .row.playing { background: #333; }
        .row.playing .cell.active { background: #fff; color: #000; }

        /* Floating Vis */
        #vis-window {
            position: absolute; top: 20px; right: 20px; width: 320px; height: 240px;
            border: 2px solid #fff; background: #000; cursor: move; z-index: 100; box-shadow: 5px 5px 0px #333;
        }
        #vis-header { background: #fff; color: #000; padding: 5px; font-weight: bold; font-size: 12px; }
        canvas { display: block; }
    </style>
</head>
<body>

    <h1>WebTracker Pro v3 (ADSR Fix & Smart Autogen)</h1>

    <div class="container">
        <div class="column">
            <button onclick="togglePlayback()" id="playBtn">Play / Stop</button>
            <button onclick="autogeneratePattern()" class="red">Autogenerate</button>
            <br>
            <label style="display:inline-block; margin-right: 15px;">Tempo: <input type="number" id="bpmInput" value="125" style="width: 50px;"></label>
            <label style="display:inline-block;">Rivit (8-32): <input type="number" id="patternLength" value="16" min="8" max="32" onchange="updatePatternLength()" style="width: 50px;"></label>
            
            <p style="color: #777; font-size: 11px;">Nuotit: Z-M. Rummut: 1 (Kick), 2 (Snare), 3 (Hat). Poista: Delete.</p>
            <div id="pattern-editor"></div>
        </div>

        <div class="column" style="max-width: 400px;">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('synth')">VCO/VCF/VCA</div>
                <div class="tab" onclick="switchTab('drums')">Drums</div>
                <div class="tab" onclick="switchTab('fx')">Arp & LFO</div>
            </div>

            <div id="synth" class="panel active">
                <h3>VCO (Mix)</h3>
                <label>Square Vol <input type="range" id="sqrVol" min="0" max="1" step="0.1" value="0.6"></label>
                <label>Sine Vol <input type="range" id="sinVol" min="0" max="1" step="0.1" value="0.4"></label>
                <label>Triangle Vol <input type="range" id="triVol" min="0" max="1" step="0.1" value="0.5"></label>
                <hr style="border-color:#333;">
                <h3>VCF & VCA (ADSR)</h3>
                <label>VCF Cutoff <input type="range" id="vcfCutoff" min="100" max="5000" step="10" value="2500"></label>
                <label>VCF Res (Q) <input type="range" id="vcfRes" min="0" max="20" step="0.5" value="2"></label>
                <label>Attack <input type="range" id="envA" min="0.01" max="1" step="0.01" value="0.02"></label>
                <label>Decay <input type="range" id="envD" min="0.01" max="1" step="0.01" value="0.2"></label>
                <label>Sustain <input type="range" id="envS" min="0" max="1" step="0.05" value="0.4"></label>
                <label>Release <input type="range" id="envR" min="0.01" max="2" step="0.01" value="0.4"></label>
            </div>

            <div id="drums" class="panel">
                <h3>Kick Drum</h3>
                <label>Tone (Hz) <input type="range" id="kickTone" min="50" max="400" step="10" value="150"></label>
                <label>Snap (Pitch drop) <input type="range" id="kickSnap" min="0.01" max="0.2" step="0.01" value="0.05"></label>
                <label>Decay (Length) <input type="range" id="kickDecay" min="0.05" max="0.5" step="0.01" value="0.15"></label>
            </div>

            <div id="fx" class="panel">
                <h3>Arpeggiator</h3>
                <label>Arp Mode
                    <select id="arpMode" style="width: 100%;">
                        <option value="off">1. Off</option>
                        <option value="major">2. Major (0, 4, 7)</option>
                        <option value="minor">3. Minor (0, 3, 7)</option>
                        <option value="octave">4. Octave (0, 12)</option>
                    </select>
                </label>
                <label>Arp Speed (Hz) <input type="range" id="arpSpeed" min="4" max="30" step="1" value="15"></label>
                <hr style="border-color:#333;">
                <h3>Tremolo</h3>
                <label>Rate <input type="range" id="lfoRate" min="0" max="20" step="0.5" value="0"></label>
                <label>Depth <input type="range" id="lfoDepth" min="0" max="1" step="0.05" value="0"></label>
            </div>
        </div>
    </div>

    <div id="vis-window">
        <div id="vis-header">VISUALIZER - Drag me</div>
        <canvas id="visCanvas" width="320" height="215"></canvas>
    </div>

<script>
    function switchTab(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    // --- WEB AUDIO API ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < output.length; i++) output[i] = Math.random() * 2 - 1;

    class SynthChannel {
        constructor(ctx) {
            this.ctx = ctx;
            this.vcoSqr = this.ctx.createOscillator(); this.vcoSqr.type = 'square';
            this.vcoSin = this.ctx.createOscillator(); this.vcoSin.type = 'sine';
            this.vcoTri = this.ctx.createOscillator(); this.vcoTri.type = 'triangle';
            
            this.gainSqr = this.ctx.createGain(); this.gainSin = this.ctx.createGain(); this.gainTri = this.ctx.createGain();
            this.vcf = this.ctx.createBiquadFilter(); this.vcf.type = 'lowpass';
            
            this.vca = this.ctx.createGain(); this.vca.gain.value = 0;
            this.tremoloGain = this.ctx.createGain();
            this.lfo = this.ctx.createOscillator(); this.lfo.type = 'sine';
            this.lfoGain = this.ctx.createGain();
            
            this.vcoSqr.connect(this.gainSqr); this.gainSqr.connect(this.vcf);
            this.vcoSin.connect(this.gainSin); this.gainSin.connect(this.vcf);
            this.vcoTri.connect(this.gainTri); this.gainTri.connect(this.vcf);
            this.vcf.connect(this.vca); this.vca.connect(this.tremoloGain); this.tremoloGain.connect(this.ctx.destination);
            
            this.lfo.connect(this.lfoGain); this.lfoGain.connect(this.tremoloGain.gain);
            this.vcoSqr.start(); this.vcoSin.start(); this.vcoTri.start(); this.lfo.start();
        }

        playNote(freq, time) {
            this.gainSqr.gain.value = parseFloat(document.getElementById('sqrVol').value) * 0.3;
            this.gainSin.gain.value = parseFloat(document.getElementById('sinVol').value) * 0.3;
            this.gainTri.gain.value = parseFloat(document.getElementById('triVol').value) * 0.3;
            this.vcf.frequency.value = parseFloat(document.getElementById('vcfCutoff').value);
            this.vcf.Q.value = parseFloat(document.getElementById('vcfRes').value);
            
            this.lfo.frequency.value = parseFloat(document.getElementById('lfoRate').value);
            let depth = parseFloat(document.getElementById('lfoDepth').value);
            this.lfoGain.gain.value = depth; this.tremoloGain.gain.value = 1.0 - depth;
            
            // Arpeggiator Logic
            let arpMode = document.getElementById('arpMode').value;
            let arpSpeed = parseFloat(document.getElementById('arpSpeed').value);
            
            this.vcoSqr.frequency.cancelScheduledValues(time);
            this.vcoSin.frequency.cancelScheduledValues(time);
            this.vcoTri.frequency.cancelScheduledValues(time);

            if(arpMode !== 'off') {
                const arpIntervals = { 'major': [1, 1.2599, 1.4983], 'minor': [1, 1.1892, 1.4983], 'octave': [1, 2] };
                let notes = arpIntervals[arpMode];
                for(let i=0; i < arpSpeed; i++) {
                    let stepTime = time + (i / arpSpeed);
                    let multiplier = notes[i % notes.length];
                    this.vcoSqr.frequency.setValueAtTime(freq * multiplier, stepTime);
                    this.vcoSin.frequency.setValueAtTime(freq * multiplier, stepTime);
                    this.vcoTri.frequency.setValueAtTime((freq/2) * multiplier, stepTime);
                }
            } else {
                this.vcoSqr.frequency.setValueAtTime(freq, time);
                this.vcoSin.frequency.setValueAtTime(freq, time);
                this.vcoTri.frequency.setValueAtTime(freq / 2, time);
            }

            // ADSR - Lisätty Sustain takaisin jotta syna ei katkea liian nopeasti!
            let a = parseFloat(document.getElementById('envA').value);
            let d = parseFloat(document.getElementById('envD').value);
            let s = parseFloat(document.getElementById('envS').value); // Sustain
            let r = parseFloat(document.getElementById('envR').value);

            this.vca.gain.cancelScheduledValues(time);
            this.vca.gain.setValueAtTime(0, time);
            this.vca.gain.linearRampToValueAtTime(1, time + a); 
            this.vca.gain.linearRampToValueAtTime(s, time + a + d); 
            
            // Sustain pysyy voimassa kunnes kirjekuori ajetaan nollaan (Release)
            this.vca.gain.linearRampToValueAtTime(0.001, time + a + d + r);
        }

        playKick(time) {
            let tone = parseFloat(document.getElementById('kickTone').value);
            let snap = parseFloat(document.getElementById('kickSnap').value);
            let decay = parseFloat(document.getElementById('kickDecay').value);

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            
            osc.frequency.setValueAtTime(tone, time);
            osc.frequency.exponentialRampToValueAtTime(40, time + snap);
            
            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + decay);
            osc.start(time); osc.stop(time + decay);
        }

        playSnare(time) {
            const noise = this.ctx.createBufferSource(); noise.buffer = noiseBuffer;
            const noiseFilter = this.ctx.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 2000;
            const noiseGain = this.ctx.createGain();
            noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(this.ctx.destination);
            noiseGain.gain.setValueAtTime(0.8, time); noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            noise.start(time); noise.stop(time + 0.2);
        }

        playHat(time) {
            const noise = this.ctx.createBufferSource(); noise.buffer = noiseBuffer;
            const noiseFilter = this.ctx.createBiquadFilter(); noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 6000;
            const noiseGain = this.ctx.createGain();
            noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(this.ctx.destination);
            noiseGain.gain.setValueAtTime(0.4, time); noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
            noise.start(time); noise.stop(time + 0.05);
        }
    }

    // --- TRACKER LOGIC ---
    // Lisätty oktaavi 3 bassoja varten!
    const noteFreqs = { 
        'C-3': 130.81, 'C#3': 138.59, 'D-3': 146.83, 'D#3': 155.56, 'E-3': 164.81, 'F-3': 174.61, 'F#3': 185.00, 'G-3': 196.00, 'G#3': 207.65, 'A-3': 220.00, 'A#3': 233.08, 'B-3': 246.94,
        'C-4': 261.63, 'C#4': 277.18, 'D-4': 293.66, 'D#4': 311.13, 'E-4': 329.63, 'F-4': 349.23, 'F#4': 369.99, 'G-4': 392.00, 'G#4': 415.30, 'A-4': 440.00, 'A#4': 466.16, 'B-4': 493.88,
        'C-5': 523.25
    };
    const keyMap = { 'z':'C-4', 's':'C#4', 'x':'D-4', 'd':'D#4', 'c':'E-4', 'v':'F-4', 'g':'F#4', 'b':'G-4', 'h':'G#4', 'n':'A-4', 'j':'A#4', 'm':'B-4', '1':'K-4', '2':'S-4', '3':'H-4' }; 
    
    let activeRows = 16; 
    const maxRows = 32; 
    const totalCols = 4; 
    let pattern = Array.from({length: maxRows}, () => Array(totalCols).fill('---'));
    let cursorRow = 0; let cursorCol = 0; let currentRow = 0;
    let isPlaying = false; let seqInterval; let channels = [];

    function initAudio() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        if(channels.length === 0) channels = [new SynthChannel(audioCtx), new SynthChannel(audioCtx), new SynthChannel(audioCtx), new SynthChannel(audioCtx)];
    }

    function updatePatternLength() {
        let val = parseInt(document.getElementById('patternLength').value);
        if(val >= 8 && val <= 32) activeRows = val;
        if(cursorRow >= activeRows) cursorRow = activeRows - 1;
        renderPattern();
    }

    function renderPattern() {
        const editor = document.getElementById('pattern-editor');
        editor.innerHTML = '';
        for (let r = 0; r < activeRows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row' + (r === currentRow && isPlaying ? ' playing' : '');
            
            const rowNum = document.createElement('div'); rowNum.className = 'row-number';
            rowNum.innerText = r.toString().padStart(2, '0');
            rowDiv.appendChild(rowNum);

            for (let c = 0; c < totalCols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell' + (r === cursorRow && c === cursorCol ? ' active' : '');
                
                if(pattern[r][c] === 'K-4') cell.style.color = '#f55';
                if(pattern[r][c] === 'S-4') cell.style.color = '#5f5';
                if(pattern[r][c] === 'H-4') cell.style.color = '#aa5';
                
                cell.innerText = pattern[r][c];
                cell.onmousedown = () => { cursorRow = r; cursorCol = c; renderPattern(); };
                rowDiv.appendChild(cell);
            }
            editor.appendChild(rowDiv);
        }
    }

    function playRow() {
        let time = audioCtx.currentTime;
        for(let i = 0; i < totalCols; i++) {
            const note = pattern[currentRow][i];
            if(note === 'K-4') { channels[i].playKick(time); flashVis('#ff0000'); }
            else if(note === 'S-4') { channels[i].playSnare(time); }
            else if(note === 'H-4') { channels[i].playHat(time); }
            else if(note !== '---' && noteFreqs[note]) { channels[i].playNote(noteFreqs[note], time); }
        }
        currentRow = (currentRow + 1) % activeRows;
        
        let editor = document.getElementById('pattern-editor');
        if(currentRow * 22 > editor.scrollTop + editor.clientHeight - 50) {
            editor.scrollTop = currentRow * 22 - 50;
        } else if (currentRow === 0) editor.scrollTop = 0;

        renderPattern();
    }

    function togglePlayback() {
        initAudio();
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "Play / Stop";
        document.getElementById('playBtn').style.background = isPlaying ? "#f00" : "#0f0";
        document.getElementById('playBtn').style.color = isPlaying ? "#fff" : "#000";

        if(isPlaying) {
            currentRow = 0;
            const bpm = parseInt(document.getElementById('bpmInput').value) || 125;
            seqInterval = setInterval(playRow, 60000 / (bpm * 4));
        } else {
            clearInterval(seqInterval);
            renderPattern();
        }
    }

    // --- UUSI FIKSU AUTOGENERATE ---
    function autogeneratePattern() {
        // Valmistellaan hyvät synasäädöt jotta ääni kantaa
        document.getElementById('vcfCutoff').value = 2800;
        document.getElementById('envA').value = 0.02;
        document.getElementById('envD').value = 0.2;
        document.getElementById('envS').value = 0.4;
        document.getElementById('envR').value = 0.5;
        document.getElementById('arpMode').value = "off"; 

        const melScale = ['C-4', 'D-4', 'D#4', 'F-4', 'G-4', 'A#4', 'C-5'];

        for(let r=0; r<activeRows; r++) {
            // Kanava 1: Synkopoitu Melodia
            if (r % 2 !== 0 && Math.random() > 0.4) {
                pattern[r][0] = melScale[Math.floor(Math.random() * melScale.length)];
            } else if (r % 4 === 0 && Math.random() > 0.6) {
                pattern[r][0] = melScale[Math.floor(Math.random() * melScale.length)];
            } else {
                pattern[r][0] = '---';
            }

            // Kanava 2: Groovaava Bassolinja (Oktaavi 3)
            if (r % 2 === 0) {
                pattern[r][1] = Math.random() > 0.2 ? 'C-3' : 'C-4';
            } else {
                pattern[r][1] = Math.random() > 0.8 ? 'D#3' : '---';
            }
            
            // Kanava 3: Kick ja Snare
            if (r % 4 === 0) pattern[r][2] = 'K-4';
            else if (r % 4 === 2) pattern[r][2] = 'S-4';
            else pattern[r][2] = '---';

            // Kanava 4: Hi-Hat off-beateillä
            pattern[r][3] = (r % 2 !== 0) ? 'H-4' : '---'; 
        }
        renderPattern();
    }

    // --- INPUT ---
    document.addEventListener('keydown', (e) => {
        if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
            e.preventDefault();
            if (e.key === "ArrowUp") cursorRow = (cursorRow > 0) ? cursorRow - 1 : activeRows - 1;
            if (e.key === "ArrowDown") cursorRow = (cursorRow < activeRows - 1) ? cursorRow + 1 : 0;
            if (e.key === "ArrowLeft") cursorCol = (cursorCol > 0) ? cursorCol - 1 : totalCols - 1;
            if (e.key === "ArrowRight") cursorCol = (cursorCol < totalCols - 1) ? cursorCol + 1 : 0;
            
            let editor = document.getElementById('pattern-editor');
            if(cursorRow * 22 > editor.scrollTop + editor.clientHeight - 30) editor.scrollTop += 22;
            if(cursorRow * 22 < editor.scrollTop) editor.scrollTop -= 22;

        } else if (e.key === 'Delete' || e.key === 'Backspace') {
            pattern[cursorRow][cursorCol] = '---';
            cursorRow = (cursorRow < activeRows - 1) ? cursorRow + 1 : 0;
        } else if (keyMap[e.key.toLowerCase()]) {
            let note = keyMap[e.key.toLowerCase()];
            pattern[cursorRow][cursorCol] = note;
            
            initAudio();
            if(note === 'K-4') channels[cursorCol].playKick(audioCtx.currentTime);
            else if(note === 'S-4') channels[cursorCol].playSnare(audioCtx.currentTime);
            else if(note === 'H-4') channels[cursorCol].playHat(audioCtx.currentTime);
            else channels[cursorCol].playNote(noteFreqs[note], audioCtx.currentTime);
            
            cursorRow = (cursorRow < activeRows - 1) ? cursorRow + 1 : 0;
        }
        renderPattern();
    });

    // --- VISUALIZER ---
    const canvas = document.getElementById('visCanvas');
    const ctx = canvas.getContext('2d');
    const palette16 = ["#000", "#FFF", "#800", "#AFE", "#C4C", "#0C5", "#00A", "#EE7", "#D85", "#640", "#F77", "#333", "#777", "#AF6", "#08F", "#BBB"];
    let flashColor = null;

    function flashVis(color) { flashColor = color; }

    function drawVisuals() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        if(flashColor) {
            ctx.fillStyle = flashColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            flashColor = null;
        } else if(isPlaying) {
            ctx.fillStyle = palette16[Math.floor(Math.random() * 16)];
            ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 40 + 10, Math.random() * 40 + 10);
        }
        requestAnimationFrame(drawVisuals);
    }
    drawVisuals();

    // --- DRAG WINDOW ---
    let isDragging = false; let offsetX, offsetY;
    const visWin = document.getElementById('vis-window');
    document.getElementById('vis-header').addEventListener('mousedown', (e) => { isDragging = true; offsetX = e.clientX - visWin.offsetLeft; offsetY = e.clientY - visWin.offsetTop; });
    document.addEventListener('mousemove', (e) => { if(isDragging) { visWin.style.left = (e.clientX - offsetX) + 'px'; visWin.style.top = (e.clientY - offsetY) + 'px'; } });
    document.addEventListener('mouseup', () => isDragging = false);

    renderPattern();
</script>
<button onclick="window.location.href='tracker.html';">parempi soitin</button>
</body>
</html>
