<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>C64/AdLib Tracker</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; margin: 0; padding: 20px; overflow: hidden; }
        .tabs { display: flex; border-bottom: 2px solid #0f0; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; border: 1px solid #0f0; border-bottom: none; margin-right: 5px; background: #222; }
        .tab.active { background: #0f0; color: #000; font-weight: bold; }
        .panel { display: none; }
        .panel.active { display: block; }
        
        button { background: #0f0; color: #000; border: none; padding: 5px 10px; cursor: pointer; font-family: inherit; font-weight: bold; margin-bottom: 10px;}
        button:hover { background: #fff; }
        
        /* Floating Vis Window */
        #vis-window {
            position: absolute; top: 50px; right: 50px; width: 320px; height: 240px;
            border: 2px solid #fff; background: #000; cursor: move; z-index: 100; box-shadow: 5px 5px 0px #333;
        }
        #vis-header { background: #fff; color: #000; padding: 5px; font-weight: bold; font-size: 12px; }
        canvas { display: block; }

        /* Tracker Pattern Editor */
        #pattern-editor { margin-top: 10px; font-family: monospace; background: #000; padding: 10px; height: 300px; overflow-y: hidden; border: 1px solid #333; width: fit-content; }
        .row { display: flex; padding: 2px 0; }
        .row-number { width: 30px; color: #555; }
        .cell { width: 60px; text-align: center; border: 1px solid transparent; cursor: pointer; color: #aaa; }
        .cell.active { background: #0f0; color: #000; font-weight: bold; }
        .row.playing { background: #333; }
        .row.playing .cell.active { background: #fff; color: #000; }
    </style>
</head>
<body>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('tracker')">Tracker</div>
        <div class="tab" onclick="switchTab('synth')">VCO/VCA/VCF</div>
        <div class="tab" onclick="switchTab('fx')">Arp & Tremolo</div>
    </div>

    <div id="tracker" class="panel active">
        <button onclick="togglePlayback()">Play / Stop</button>
        <label>Tempo: <input type="number" id="bpmInput" value="120" style="width: 50px;"></label>
        <p style="color: #aaa; font-size: 12px;">Navigoi nuolilla. Nuotit: Z, S, X, D, C, V, G, B, H, N, J, M. Poista: Delete.</p>
        <div id="pattern-editor"></div>
    </div>

    <div id="synth" class="panel">
        <p>Aaltomuoto: <strong>Mixed (SQR + SIN + TRI)</strong></p>
        <p>ADSR & Filter ovat koodattu suoraan SynthChannel-luokkaan prototyypissä.</p>
    </div>

    <div id="fx" class="panel">
        <p>Arpeggiaattori ja efektit tulevat tänne.</p>
    </div>

    <div id="vis-window">
        <div id="vis-header">VISUALIZER (16-COLOR) - Drag me</div>
        <canvas id="visCanvas" width="320" height="215"></canvas>
    </div>

<script>
    // Tab Logic
    function switchTab(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    // Audio Context & Synth
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    class SynthChannel {
        constructor(ctx) {
            this.ctx = ctx;
            this.vcoSqr = this.ctx.createOscillator(); this.vcoSqr.type = 'square';
            this.vcoSin = this.ctx.createOscillator(); this.vcoSin.type = 'sine';
            this.vcoTri = this.ctx.createOscillator(); this.vcoTri.type = 'triangle';
            
            this.vcf = this.ctx.createBiquadFilter();
            this.vcf.type = 'lowpass'; this.vcf.frequency.value = 1500;
            
            this.vca = this.ctx.createGain(); this.vca.gain.value = 0;

            this.vcoSqr.connect(this.vcf); this.vcoSin.connect(this.vcf); this.vcoTri.connect(this.vcf);
            this.vcf.connect(this.vca); this.vca.connect(this.ctx.destination);

            this.vcoSqr.start(); this.vcoSin.start(); this.vcoTri.start();
        }
        playNoteWithADSR(freq, attack, decay, sustain, release) {
            const now = this.ctx.currentTime;
            this.vcoSqr.frequency.setValueAtTime(freq, now);
            this.vcoSin.frequency.setValueAtTime(freq, now);
            this.vcoTri.frequency.setValueAtTime(freq, now);

            this.vca.gain.cancelScheduledValues(now);
            this.vca.gain.setValueAtTime(0, now);
            this.vca.gain.linearRampToValueAtTime(0.2, now + attack); 
            this.vca.gain.linearRampToValueAtTime(0.2 * sustain, now + attack + decay); 
            this.vca.gain.linearRampToValueAtTime(0, now + attack + decay + release);
        }
    }

    // Tracker Logic
    const noteFreqs = { 'C-4': 261.63, 'C#4': 277.18, 'D-4': 293.66, 'D#4': 311.13, 'E-4': 329.63, 'F-4': 349.23, 'F#4': 369.99, 'G-4': 392.00, 'G#4': 415.30, 'A-4': 440.00, 'A#4': 466.16, 'B-4': 493.88 };
    const keyMap = { 'z':'C-4', 's':'C#4', 'x':'D-4', 'd':'D#4', 'c':'E-4', 'v':'F-4', 'g':'F#4', 'b':'G-4', 'h':'G#4', 'n':'A-4', 'j':'A#4', 'm':'B-4' };
    
    const totalRows = 16; const totalCols = 3;
    let pattern = Array.from({length: totalRows}, () => Array(totalCols).fill('---'));
    let cursorRow = 0; let cursorCol = 0; let currentRow = 0;
    let isPlaying = false; let seqInterval; let channels = [];

    function initChannels() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        if(channels.length === 0) channels = [new SynthChannel(audioCtx), new SynthChannel(audioCtx), new SynthChannel(audioCtx)];
    }

    function renderPattern() {
        const editor = document.getElementById('pattern-editor');
        editor.innerHTML = '';
        for (let r = 0; r < totalRows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row' + (r === currentRow && isPlaying ? ' playing' : '');
            
            const rowNum = document.createElement('div'); rowNum.className = 'row-number';
            rowNum.innerText = r.toString(16).padStart(2, '0').toUpperCase();
            rowDiv.appendChild(rowNum);

            for (let c = 0; c < totalCols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell' + (r === cursorRow && c === cursorCol ? ' active' : '');
                cell.innerText = pattern[r][c];
                cell.onmousedown = () => { cursorRow = r; cursorCol = c; renderPattern(); };
                rowDiv.appendChild(cell);
            }
            editor.appendChild(rowDiv);
        }
    }

    function playRow() {
        for(let i = 0; i < totalCols; i++) {
            const note = pattern[currentRow][i];
            if(note !== '---' && noteFreqs[note]) channels[i].playNoteWithADSR(noteFreqs[note], 0.05, 0.1, 0.5, 0.2);
        }
        currentRow = (currentRow + 1) % totalRows;
        renderPattern();
    }

    function togglePlayback() {
        initChannels();
        isPlaying = !isPlaying;
        if(isPlaying) {
            currentRow = 0;
            const bpm = parseInt(document.getElementById('bpmInput').value) || 120;
            seqInterval = setInterval(playRow, 60000 / (bpm * 4));
        } else {
            clearInterval(seqInterval);
            renderPattern();
        }
    }

    // Input Handling
    document.addEventListener('keydown', (e) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
            e.preventDefault();
            if (e.key === "ArrowUp") cursorRow = (cursorRow > 0) ? cursorRow - 1 : totalRows - 1;
            if (e.key === "ArrowDown") cursorRow = (cursorRow < totalRows - 1) ? cursorRow + 1 : 0;
            if (e.key === "ArrowLeft") cursorCol = (cursorCol > 0) ? cursorCol - 1 : totalCols - 1;
            if (e.key === "ArrowRight") cursorCol = (cursorCol < totalCols - 1) ? cursorCol + 1 : 0;
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
            pattern[cursorRow][cursorCol] = '---';
            cursorRow = (cursorRow < totalRows - 1) ? cursorRow + 1 : 0;
        } else if (keyMap[e.key.toLowerCase()]) {
            pattern[cursorRow][cursorCol] = keyMap[e.key.toLowerCase()];
            initChannels();
            channels[cursorCol].playNoteWithADSR(noteFreqs[pattern[cursorRow][cursorCol]], 0.01, 0.1, 0.5, 0.1);
            cursorRow = (cursorRow < totalRows - 1) ? cursorRow + 1 : 0;
        }
        renderPattern();
    });

    // Visualizer Logic
    const ctx = document.getElementById('visCanvas').getContext('2d');
    const palette16 = ["#000", "#FFF", "#800", "#AFE", "#C4C", "#0C5", "#00A", "#EE7", "#D85", "#640", "#F77", "#333", "#777", "#AF6", "#08F", "#BBB"];
    function drawVisuals() {
        ctx.fillStyle = palette16[Math.floor(Math.random() * 16)];
        ctx.fillRect(Math.random() * 320, Math.random() * 215, Math.random() * 50, Math.random() * 50);
        requestAnimationFrame(drawVisuals);
    }
    drawVisuals();

    // Draggable Window
    let isDragging = false; let offsetX, offsetY;
    const visWin = document.getElementById('vis-window');
    document.getElementById('vis-header').addEventListener('mousedown', (e) => { isDragging = true; offsetX = e.clientX - visWin.offsetLeft; offsetY = e.clientY - visWin.offsetTop; });
    document.addEventListener('mousemove', (e) => { if(isDragging) { visWin.style.left = (e.clientX - offsetX) + 'px'; visWin.style.top = (e.clientY - offsetY) + 'px'; } });
    document.addEventListener('mouseup', () => isDragging = false);

    renderPattern();
</script>
</body>
</html>
